name: Check Token

# Diagnostic only. Run this before a release, or whenever a release workflow
# fails on authentication, to see exactly what is wrong with PACKAGES_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check PACKAGES_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # persist-credentials: false so the write probe uses PACKAGES_TOKEN and
      # not the read-only GITHUB_TOKEN checkout would otherwise leave behind.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check PACKAGES_TOKEN
        uses: ./.github/actions/check-packages-token
        with:
          token: ${{ secrets.PACKAGES_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### PACKAGES_TOKEN is usable"
            echo
            echo "The token is live and can push to \`$GITHUB_REPOSITORY\`."
            echo "Any scope warnings above still apply to publishing."
          } >> "$GITHUB_STEP_SUMMARY"
