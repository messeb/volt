changelog:
  exclude:
    labels:
      - "ignore-for-release"
      - "chore"
  categories:
    - title: "Breaking Changes"
      labels:
        - "breaking-change"
    - title: "New Features"
      labels:
        - "enhancement"
        - "feature"
    - title: "Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "Security"
      labels:
        - "security"
    - title: "Documentation"
      labels:
        - "documentation"
    - title: "Maintenance"
      labels:
        - "dependencies"
        - "refactor"
        - "ci"
    - title: "Other Changes"
      labels:
        - "*"

