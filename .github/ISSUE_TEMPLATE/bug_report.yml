name: Bug Report
description: Report reproducible incorrect behavior in Volt
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Volt. Remove secrets from all examples and logs.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide the smallest runnable route or test that reproduces the issue.
      render: java
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: volt-version
    attributes:
      label: Volt Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: java-version
    attributes:
      label: Java Version
      options:
        - "21"
        - "22"
        - "23"
        - "24"
        - "25 or newer"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true

