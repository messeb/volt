name: Check PACKAGES_TOKEN
description: >-
  Fails with an actionable message when the release token is missing, expired,
  malformed, or lacks the permissions the release workflows need.

inputs:
  token:
    description: The PACKAGES_TOKEN secret
    required: true

runs:
  using: composite
  steps:
    - name: Check PACKAGES_TOKEN
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        setup="Create a classic token at https://github.com/settings/tokens"
        setup="$setup with the repo, write:packages and delete:packages"
        setup="$setup scopes, then store it as PACKAGES_TOKEN under"
        setup="$setup Settings > Secrets and variables > Actions."

        if [[ -z "$GH_TOKEN" ]]; then
          echo "::error::secret PACKAGES_TOKEN is not set. $setup"
          exit 1
        fi

        if [[ "$GH_TOKEN" != "$(tr -d '[:space:]' <<<"$GH_TOKEN")" ]]; then
          echo "::error::PACKAGES_TOKEN contains whitespace. Re-add it" \
            "without a trailing newline: gh secret set PACKAGES_TOKEN"
          exit 1
        fi

        scopes="$(curl -sS -o /dev/null -D - \
          -H "Authorization: token $GH_TOKEN" \
          https://api.github.com/user \
          | tr -d '\r' | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: //p')"

        if ! gh api user --jq '.login' >/dev/null 2>&1; then
          echo "::error::PACKAGES_TOKEN was rejected by GitHub. It is" \
            "expired, revoked, or malformed. If it is a fine-grained token," \
            "make sure this repository is selected and Contents is set to" \
            "Read and write. $setup"
          exit 1
        fi

        echo "token scopes: ${scopes:-none reported (fine-grained token)}"

        # repos/{repo}.permissions reports the authenticated *user's* role, so
        # it says push=true for the owner even when the token grants nothing.
        # A dry-run push is the only cheap probe that the server actually
        # authorizes, and it creates nothing.
        probe="$(git push --dry-run \
          "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" \
          "HEAD:refs/heads/ci/token-write-probe" 2>&1 || true)"

        if grep -qiE 'write access|403|denied|not granted' <<<"$probe"; then
          echo "::error::PACKAGES_TOKEN authenticates but has no write" \
            "access to $GITHUB_REPOSITORY. A fine-grained token needs this" \
            "repository selected with Contents: Read and write; a classic" \
            "token needs the repo scope. $setup"
          echo "$probe"
          exit 1
        fi

        if [[ -n "$scopes" ]] \
          && [[ ",${scopes// /}," != *",repo,"* ]] \
          && [[ ",${scopes// /}," != *",public_repo,"* ]]; then
          echo "::error::PACKAGES_TOKEN carries neither the repo nor the" \
            "public_repo scope, so it cannot push. $setup"
          exit 1
        fi

        for scope in write:packages delete:packages; do
          if [[ ",${scopes// /}," != *",$scope,"* ]]; then
            echo "::warning::token does not report the $scope scope;" \
              "publishing or overwriting the release candidate may fail"
          fi
        done
